name: tests

on:
  push:
  pull_request:

jobs:
  deterministic-checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit tests for the design checker (stdlib only, no API calls)
        run: python3 -m unittest discover -s tests -v
      - name: Both shipped templates pass every design rule
        run: |
          python3 skills/executive-brief/scripts/check_brief_design.py skills/executive-brief/assets/one-page-brief-template.html
          python3 skills/executive-brief/scripts/check_brief_design.py skills/executive-brief/assets/five-page-brief-template.html
      - name: Plugin and marketplace manifests are valid JSON
        run: |
          python3 -c "import json; json.load(open('.claude-plugin/plugin.json')); json.load(open('.claude-plugin/marketplace.json')); print('manifests ok')"
